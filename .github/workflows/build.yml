name: Build GlideProbe.dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install ldid and dpkg
        run: |
          brew install ldid
          brew install dpkg || true

      - name: Download iOS SDKs
        run: |
          mkdir -p "$THEOS/sdks"
          curl -L -o /tmp/sdks.tar.gz \
            https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar -xzf /tmp/sdks.tar.gz -C /tmp
          for d in /tmp/sdks-master/iPhoneOS*.sdk; do
            cp -R "$d" "$THEOS/sdks/"
          done
          ls "$THEOS/sdks"

      - name: Build
        run: |
          make clean || true
          make package FINALPACKAGE=1

      - name: Collect artifacts
        run: |
          mkdir -p out
          find .theos/obj -name "GlideProbe.dylib" -exec cp {} out/ \; || true
          find packages -name "*.deb" -exec cp {} out/ \; || true
          ls -la out

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlideProbe-build
          path: out/*
          if-no-files-found: warn
